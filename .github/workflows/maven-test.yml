name: Java Maven Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona tu repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Instala JDK 24
      - name: Set up JDK 24
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 24

      # 3️⃣ Compila y corre tests de Maven
      - name: Build and run tests
        run: mvn -B -ntp test