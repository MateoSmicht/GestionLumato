name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: 'maven'
        # Nota: Si Java 24 da error por ser muy nuevo/EA, 
        # cambia '24' por '21' aquí y en tu pom.xml temporalmente.

    - name: Ejecutar Tests con Maven
      run: mvn -B test --file pom.xml